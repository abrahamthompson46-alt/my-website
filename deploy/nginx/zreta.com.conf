# zreta.com — Nginx site config
# VPS: 162.35.179.20
#
# SSL: Cloudflare Origin Certificate
#   Cert: /etc/ssl/cloudflare/zreta.com.pem
#   Key:  /etc/ssl/cloudflare/zreta.com.key
#   Cloudflare SSL mode: Full (strict)
#
# Install:
#   sudo cp deploy/nginx/zreta.com.conf /etc/nginx/sites-available/zreta.com
#   sudo ln -sf /etc/nginx/sites-available/zreta.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream zreta_gunicorn {
    server unix:/run/zreta/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name zreta.com www.zreta.com;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zreta.com www.zreta.com;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    ssl_certificate     /etc/ssl/cloudflare/zreta.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/zreta.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 25M;

    access_log /var/log/nginx/zreta.com.access.log;
    error_log  /var/log/nginx/zreta.com.error.log;

    location /static/ {
        alias /var/www/marketing-site/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /var/www/marketing-site/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /health/ {
        proxy_pass http://zreta_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    location / {
        proxy_pass http://zreta_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
