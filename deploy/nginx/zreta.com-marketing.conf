# Marketing website — zreta.com + www.zreta.com
# Canonical production layout: Gunicorn on 127.0.0.1:8001 (see deploy/gunicorn/gunicorn.conf.py)
# SSL: Certbot certificate for zreta.com / www.zreta.com
#
# Install (after verifying paths on the VPS):
#   sudo cp deploy/nginx/zreta.com-marketing.conf /etc/nginx/sites-available/zreta.com
#   sudo ln -sf /etc/nginx/sites-available/zreta.com /etc/nginx/sites-enabled/zreta.com
#   sudo nginx -t && sudo systemctl reload nginx

upstream zreta_gunicorn {
    server 127.0.0.1:8001 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name zreta.com www.zreta.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zreta.com www.zreta.com;

    ssl_certificate     /etc/letsencrypt/live/zreta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zreta.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;

    access_log /var/log/nginx/zreta.com.access.log;
    error_log  /var/log/nginx/zreta.com.error.log;

    # --- Block accidental exposure of sensitive paths (defense in depth) ---
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* ^/(?:\.env|\.git|\.venv|venv|logs|deploy)(?:/|$) {
        deny all;
        return 404;
    }

    location ~* \.(?:env|sql|bak|dump|log|ini|pem|key)$ {
        deny all;
        return 404;
    }

    location /static/ {
        alias /var/www/marketing-site/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /var/www/marketing-site/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # --- Block direct nginx access to private uploads (payment proofs, etc.) ---
    location ^~ /media/private/ {
        deny all;
        return 404;
    }

    location ^~ /media/payments/proofs/ {
        deny all;
        return 404;
    }

    location = /health/ {
        proxy_pass http://zreta_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    location / {
        proxy_pass http://zreta_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
