# ChurchHub — app.zreta.com (Phase 1)
# Proxies to the EXISTING ChurchHub process on 127.0.0.1:8000
# Does NOT modify ChurchHub code or its deployment directory.
#
# Install (Phase 1):
#   sudo bash deploy/scripts/phase1-churchhub-app-subdomain.sh
#
# After certbot, SSL lines are added automatically or merged from:
#   /etc/letsencrypt/live/app.zreta.com/fullchain.pem  (dedicated cert)
#   OR expanded zreta.com certificate (see migration doc)

upstream churchhub_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.zreta.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        proxy_pass http://churchhub_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

