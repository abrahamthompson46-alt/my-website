# Marketing website — Nginx site config
# Replace YOURDOMAIN.com with your real domain before enabling.
#
# SSL: Cloudflare Origin Certificate (recommended)
#   1. Cloudflare Dashboard → SSL/TLS → Origin Server → Create Certificate
#   2. Save cert to /etc/ssl/cloudflare/YOURDOMAIN.com.pem
#   3. Save key  to /etc/ssl/cloudflare/YOURDOMAIN.com.key
#   4. Cloudflare SSL mode: Full (strict)
#
# Install:
#   sudo cp deploy/nginx/marketing-site.conf /etc/nginx/sites-available/marketing-site
#   sudo ln -sf /etc/nginx/sites-available/marketing-site /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream marketing_gunicorn {
    server unix:/run/marketing-site/gunicorn.sock fail_timeout=0;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOURDOMAIN.com www.YOURDOMAIN.com;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOURDOMAIN.com www.YOURDOMAIN.com;

    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    # --- TLS (Cloudflare Origin Certificate) ---
    ssl_certificate     /etc/ssl/cloudflare/YOURDOMAIN.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/YOURDOMAIN.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- Security headers (Cloudflare may add some; these protect direct hits too) ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 25M;

    access_log /var/log/nginx/marketing-site.access.log;
    error_log  /var/log/nginx/marketing-site.error.log;

    # --- Static files (collected by collectstatic; also served by WhiteNoise as fallback) ---
    location /static/ {
        alias /var/www/marketing-site/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- User uploads ---
    location /media/ {
        alias /var/www/marketing-site/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # --- Health check (for monitoring; no caching) ---
    location = /health/ {
        proxy_pass http://marketing_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # --- Django application ---
    location / {
        proxy_pass http://marketing_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

