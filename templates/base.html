{% load static seo_tags %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="{{ BRAND_THEME_COLOR|default:'#0a1628' }}">
    {% render_seo_head %}
    <link rel="icon" href="{% static 'images/favicon.svg' %}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="{% static 'tokens.css' %}">
    {% include "includes/brand_theme.html" %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    {% block extra_css %}{% endblock %}
    <script>
        (function () {
            var stored = localStorage.getItem("theme");
            var theme = stored || "light";
            if (theme === "system") {
                theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
</head>
<body class="{% block body_class %}{% endblock %}">
    <a href="#main-content" class="skip-link">Skip to main content</a>
    {% block body %}{% endblock %}
    <div id="toast-container" class="toast-container" aria-live="polite" aria-relevant="additions"></div>
    <script src="{% static 'js/icons.js' %}" defer></script>
    <script src="{% static 'js/theme.js' %}" defer></script>
    <script src="{% static 'js/navigation.js' %}" defer></script>
    <script src="{% static 'js/search.js' %}" defer></script>
    <script src="{% static 'js/modal.js' %}" defer></script>
    <script src="{% static 'js/main.js' %}" defer></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
