<div class="screenshot-lightbox" data-screenshot-lightbox hidden role="dialog" aria-modal="true" aria-label="Screenshot preview">
    <div class="screenshot-lightbox__backdrop" data-screenshot-lightbox-close tabindex="-1"></div>
    <div class="screenshot-lightbox__panel">
        <button type="button" class="screenshot-lightbox__close btn btn--ghost btn--sm btn--icon-only" data-screenshot-lightbox-close aria-label="Close preview">
            <span aria-hidden="true">&times;</span>
        </button>
        <img class="screenshot-lightbox__image" data-screenshot-lightbox-image alt="">
        <p class="screenshot-lightbox__caption" data-screenshot-lightbox-caption hidden></p>
    </div>
</div>
