<div class="search-overlay" data-search-overlay hidden aria-hidden="true">
    <div class="search-overlay__backdrop" data-search-close></div>
    <div class="search-overlay__panel" role="dialog" aria-modal="true" aria-label="Site search">
        <div class="search-overlay__header">
            {% include "components/search/search_bar.html" with action="/search/" placeholder="Search products, docs, resources…" name="q" size="lg" variant="overlay" extra_class="search-bar--full" %}
            <button type="button" class="btn btn--ghost btn--sm btn--icon-only" aria-label="Close search" data-search-close>
                <svg class="icon icon--md" aria-hidden="true" data-icon="x"></svg>
            </button>
        </div>
        <div class="search-overlay__results" data-search-results>
            <p class="search-overlay__hint">Type to search across the platform.</p>
        </div>
    </div>
</div>
