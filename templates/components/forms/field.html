<div class="form-field {{ extra_class }}{% if errors %} form-field--error{% endif %}">
    {% if label %}
    <label for="{{ field.id_for_label }}" class="form-label">
        {{ label }}
        {% if field.field.required and required_indicator %}
        <span class="form-label__required" aria-hidden="true">*</span>
        {% elif show_optional %}
        <span class="form-label__optional">(optional)</span>
        {% endif %}
    </label>
    {% endif %}
    <div class="form-field__control">
        {{ field }}
    </div>
    {% if help_text %}
    <p class="form-help" id="{{ field.id_for_label }}_help">{{ help_text }}</p>
    {% endif %}
    {% if errors %}
    <ul class="form-error" role="alert" aria-live="polite">
        {% for error in errors %}
        <li>{{ error }}</li>
        {% endfor %}
    </ul>
    {% endif %}
</div>
