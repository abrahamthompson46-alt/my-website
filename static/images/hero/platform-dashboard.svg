<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" role="img" aria-label="Zreta product billing dashboard with revenue overview">
  <defs>
    <linearGradient id="dash-shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="dash-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="dash-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="chart-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="chart-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar-a" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#99f6e4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="bar-b" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="kpi-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="dash-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="chart-clip">
      <rect x="40" y="148" width="328" height="118" rx="4"/>
    </clipPath>
  </defs>

  <!-- Shell -->
  <rect width="520" height="380" rx="20" fill="url(#dash-shell)" stroke="#e2e8f0" filter="url(#dash-shadow)"/>

  <!-- Title bar -->
  <path d="M0 20 C0 8.95 8.95 0 20 0 H500 C511.05 0 520 8.95 520 20 V44 H0 Z" fill="url(#dash-header)"/>
  <circle cx="24" cy="22" r="5" fill="#64748b"/>
  <circle cx="42" cy="22" r="5" fill="#94a3b8"/>
  <circle cx="60" cy="22" r="5" fill="#14b8a6"/>
  <rect x="92" y="14" width="168" height="16" rx="8" fill="rgba(255,255,255,0.12)"/>
  <rect x="400" y="12" width="96" height="20" rx="10" fill="rgba(20,184,166,0.22)" stroke="rgba(45,212,191,0.45)"/>
  <text x="448" y="26" text-anchor="middle" fill="#99f6e4" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">Live · Portal</text>
  <rect y="44" width="520" height="3" fill="url(#dash-accent)"/>

  <!-- KPI cards -->
  <rect x="24" y="64" width="114" height="58" rx="12" fill="url(#kpi-glow)" stroke="#e2e8f0"/>
  <text x="36" y="84" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">MRR</text>
  <text x="36" y="106" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700">GHS 48k</text>
  <path d="M112 88 L118 82 L124 85 L130 76" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="150" y="64" width="114" height="58" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="162" y="84" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">Active seats</text>
  <text x="162" y="106" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700">1,284</text>
  <path d="M226 90 L232 84 L238 87 L244 78" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="276" y="64" width="114" height="58" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="288" y="84" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">Collections</text>
  <text x="288" y="106" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700">98.4%</text>
  <rect x="352" y="92" width="26" height="6" rx="3" fill="#ccfbf1"/>
  <rect x="352" y="92" width="22" height="6" rx="3" fill="#14b8a6"/>

  <!-- Revenue chart panel -->
  <rect x="24" y="136" width="360" height="148" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="40" y="158" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">Revenue overview</text>
  <text x="156" y="158" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="500">Last 30 days</text>
  <rect x="286" y="146" width="82" height="20" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="327" y="160" text-anchor="middle" fill="#0f766e" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700">+18.2%</text>

  <!-- Grid -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="40" y1="188" x2="368" y2="188"/>
    <line x1="40" y1="214" x2="368" y2="214"/>
    <line x1="40" y1="240" x2="368" y2="240"/>
    <line x1="40" y1="266" x2="368" y2="266"/>
  </g>

  <!-- Soft bars behind the line -->
  <g opacity="0.55">
    <rect x="52" y="228" width="14" height="38" rx="4" fill="url(#bar-a)"/>
    <rect x="84" y="214" width="14" height="52" rx="4" fill="url(#bar-b)"/>
    <rect x="116" y="220" width="14" height="46" rx="4" fill="url(#bar-a)"/>
    <rect x="148" y="200" width="14" height="66" rx="4" fill="url(#bar-b)"/>
    <rect x="180" y="208" width="14" height="58" rx="4" fill="url(#bar-a)"/>
    <rect x="212" y="188" width="14" height="78" rx="4" fill="url(#bar-b)"/>
    <rect x="244" y="196" width="14" height="70" rx="4" fill="url(#bar-a)"/>
    <rect x="276" y="176" width="14" height="90" rx="4" fill="url(#bar-b)"/>
    <rect x="308" y="184" width="14" height="82" rx="4" fill="url(#bar-a)"/>
    <rect x="340" y="168" width="14" height="98" rx="4" fill="url(#bar-b)"/>
  </g>

  <!-- Area + line -->
  <g clip-path="url(#chart-clip)">
    <path d="M48 248 C72 236, 88 222, 112 228 C136 234, 152 204, 176 210 C200 216, 216 188, 240 178 C264 168, 280 186, 304 174 C328 162, 344 158, 360 152 L360 266 L48 266 Z" fill="url(#chart-fill)"/>
    <path id="revenue-line" d="M48 248 C72 236, 88 222, 112 228 C136 234, 152 204, 176 210 C200 216, 216 188, 240 178 C264 168, 280 186, 304 174 C328 162, 344 158, 360 152" fill="none" stroke="url(#chart-stroke)" stroke-width="3.25" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-glow)"/>
  </g>

  <!-- Peak marker + tooltip -->
  <circle cx="360" cy="152" r="10" fill="#14b8a6" opacity="0.18"/>
  <circle cx="360" cy="152" r="5.5" fill="#fff" stroke="#0d9488" stroke-width="2.5"/>
  <g transform="translate(286 118)">
    <rect width="88" height="28" rx="8" fill="#0f172a"/>
    <polygon points="64,28 70,28 67,34" fill="#0f172a"/>
    <text x="44" y="18" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="700">GHS 52.4k</text>
  </g>

  <!-- Month labels -->
  <text x="52" y="278" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="9">Wk 1</text>
  <text x="148" y="278" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="9">Wk 2</text>
  <text x="244" y="278" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="9">Wk 3</text>
  <text x="340" y="278" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="9">Wk 4</text>

  <!-- Side rail -->
  <rect x="396" y="64" width="100" height="220" rx="14" fill="url(#dash-header)"/>
  <text x="446" y="88" text-anchor="middle" fill="rgba(255,255,255,0.55)" font-family="Segoe UI, system-ui, sans-serif" font-size="9" font-weight="600">PRODUCTS</text>
  <rect x="410" y="102" width="72" height="36" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(20,184,166,0.45)"/>
  <text x="446" y="118" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">ChurchHub</text>
  <text x="446" y="132" text-anchor="middle" fill="#5eead4" font-family="Segoe UI, system-ui, sans-serif" font-size="9">Active</text>
  <rect x="410" y="148" width="72" height="36" rx="8" fill="rgba(255,255,255,0.06)"/>
  <text x="446" y="164" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">CoreTrust</text>
  <text x="446" y="178" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, system-ui, sans-serif" font-size="9">Active</text>
  <rect x="410" y="194" width="72" height="36" rx="8" fill="rgba(255,255,255,0.06)"/>
  <text x="446" y="216" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600">Billing</text>
  <rect x="410" y="244" width="72" height="26" rx="8" fill="url(#dash-accent)"/>
  <text x="446" y="261" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700">Launch</text>

  <!-- Bottom activity row -->
  <rect x="24" y="300" width="472" height="60" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="48" cy="330" r="12" fill="#ecfeff" stroke="#99f6e4"/>
  <circle cx="48" cy="330" r="4" fill="#0d9488"/>
  <text x="70" y="326" fill="#0f172a" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600">Invoice INV-204 paid</text>
  <text x="70" y="342" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="9">ChurchHub · Mobile Money</text>
  <rect x="300" y="318" width="72" height="24" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="336" y="334" text-anchor="middle" fill="#0f766e" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700">Settled</text>
  <rect x="384" y="318" width="96" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="432" y="334" text-anchor="middle" fill="#1d4ed8" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="700">GHS 1,250</text>
</svg>
