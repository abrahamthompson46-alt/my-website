name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements/base.txt
          pip install -r requirements/ci.txt
          pip install redis

      - name: Django checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          CI_USE_POSTGRES: "1"
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python manage.py check --deploy --settings=config.settings.test
          python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Run tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          CI_USE_POSTGRES: "1"
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          coverage run --source=accounts,payments,common,core manage.py test --settings=config.settings.test --verbosity=2
          coverage report --fail-under=55
          coverage xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Production readiness command
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: test-production-secret-key-with-fifty-characters-minimum
          DJANGO_ALLOWED_HOSTS: example.com
          CSRF_TRUSTED_ORIGINS: https://example.com
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_SSLMODE: disable
          REDIS_URL: redis://localhost:6379/0
          EMAIL_HOST: smtp.example.com
          EMAIL_PORT: 587
          EMAIL_HOST_USER: user@example.com
          EMAIL_HOST_PASSWORD: secret
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
        run: python manage.py check_production --settings=config.settings.production
